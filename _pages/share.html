---
layout: null
permalink: /share/
sitemap: false
---
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#ffffff">
  <title>Egor Sedov · QR</title>
  <style>
    :root { --ink: #111; --muted: #666; --line: #ddd; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #fff; color: var(--ink); }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100dvh; padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
      text-align: center; -webkit-tap-highlight-color: transparent;
    }
    h1 { font-size: 1.6rem; margin: 0 0 4px; font-weight: 650; }
    .role { color: var(--muted); font-size: 0.95rem; margin: 0 0 20px; }
    .qr { width: min(86vw, 58dvh, 420px); aspect-ratio: 1; }
    .qr svg { width: 100%; height: 100%; display: block; shape-rendering: crispEdges; }
    .qr[hidden] { display: none; }
    .url { font-size: 1.15rem; margin: 14px 0 22px; font-weight: 600; letter-spacing: 0.01em; }
    .toggle { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
    .toggle button {
      font: inherit; font-size: 0.95rem; border: 0; background: none; color: var(--muted);
      padding: 8px 20px; border-radius: 999px; cursor: pointer;
    }
    .toggle button[aria-pressed="true"] { background: var(--ink); color: #fff; }
  </style>
</head>
<body>
  <h1>Egor Sedov, PhD</h1>
  <p class="role">Machine Learning &amp; Software Engineer</p>

  <div class="qr" id="qr-home" role="img" aria-label="QR code for esf0.github.io">
    {% include share-qr-home.svg %}
  </div>
  <div class="qr" id="qr-cv" role="img" aria-label="QR code for esf0.github.io/cv" hidden>
    {% include share-qr-cv.svg %}
  </div>

  <div class="url" id="url">esf0.github.io</div>

  <div class="toggle" role="group" aria-label="Choose page">
    <button type="button" data-target="home" aria-pressed="true">Website</button>
    <button type="button" data-target="cv" aria-pressed="false">CV</button>
  </div>

  <script>
    (function () {
      var labels = { home: "esf0.github.io", cv: "esf0.github.io/cv" };
      var buttons = document.querySelectorAll(".toggle button");
      function show(target) {
        document.getElementById("qr-home").hidden = target !== "home";
        document.getElementById("qr-cv").hidden = target !== "cv";
        document.getElementById("url").textContent = labels[target];
        buttons.forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.target === target)); });
      }
      buttons.forEach(function (b) { b.addEventListener("click", function () { show(b.dataset.target); }); });
      if (location.hash === "#cv") show("cv");

      // Keep the phone screen on while the QR is shown.
      var lock = null;
      function keepAwake() {
        if (!("wakeLock" in navigator) || document.visibilityState !== "visible") return;
        navigator.wakeLock.request("screen").then(function (l) { lock = l; }).catch(function () {});
      }
      keepAwake();
      document.addEventListener("visibilitychange", keepAwake);
      document.addEventListener("click", function () { if (!lock || lock.released) keepAwake(); });
    })();
  </script>
</body>
</html>
